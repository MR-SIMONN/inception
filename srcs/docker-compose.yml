services:
  # mandatory
  mariadb:
    container_name: mariadb
    build:
      context: requirements/mariadb
    env_file:
      - .env
    secrets:
      - mysql_password
      - mysql_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
    restart: on-failure

  wordpress:
    container_name: wordpress
    build:
      context: requirements/wordpress
    env_file:
      - .env
    secrets:
      - mysql_password
      - wordpress_password
      - wordpress_admin_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    depends_on:
      - mariadb
    restart: on-failure

  nginx:
    container_name: nginx
    build:
      context: requirements/nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    depends_on:
      - wordpress
    restart: on-failure

  # bonus
  static_site:
    container_name: static_site
    build:
      context: requirements/bonus/static_site
    networks:
      - inception_network
    restart: on-failure

  adminer:
    container_name: adminer
    build:
      context: requirements/bonus/adminer
    networks:
      - inception_network
    depends_on:
      - mariadb
    restart: on-failure

  redis:
    container_name: redis
    build:
      context: requirements/bonus/redis
    networks:
      - inception_network
    restart: on-failure

  ftp:
    container_name: ftp
    build:
      context: requirements/bonus/ftp
    env_file:
      - .env
    secrets:
      - ftp_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    restart: on-failure
    ports:
      - "21:21"
      - "40000-40005:40000-40005"

  portainer:
    container_name: portainer
    build:
      context: requirements/bonus/portainer
    networks:
      - inception_network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: on-failure

secrets:
  mysql_password:
    file: ../secrets/mysql_password.txt
  mysql_root_password:
    file: ../secrets/mysql_root_password.txt
  wordpress_password:
    file: ../secrets/wordpress_password.txt
  wordpress_admin_password:
    file: ../secrets/wordpress_admin_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt

networks:
  inception_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/moel-hai/data/mariadb
      o: bind

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: /home/moel-hai/data/wordpress
      o: bind