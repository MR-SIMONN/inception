services:

  mariadb:
    container_name: mariadb
    build:
      context: requirements/mariadb
    env_file:
      - .env
    secrets:
      - mysql_password
      - mysql_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
    restart: on-failure

  wordpress:
    container_name: wordpress
    build:
      context: requirements/wordpress
    env_file:
      - .env
    secrets:
      - mysql_password
      - wordpress_password
      - wordpress_admin_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    depends_on:
      - mariadb
    restart: on-failure

  nginx:
    container_name: nginx
    build:
      context: requirements/nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    depends_on:
      - wordpress
    restart: on-failure


secrets:
  mysql_password:
    file: ../secrets/db_password.txt
  mysql_root_password:
    file: ../secrets/db_root_password.txt
  wordpress_password:
    file: ../secrets/db_password.txt
  wordpress_admin_password:
    file: ../secrets/credentials.txt

networks:
  inception_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/moel-hai/data/mariadb
      o: bind
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: /home/moel-hai/data/wordpress
      o: bind